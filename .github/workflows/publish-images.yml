name: Publish Docker images (GHCR)

# Cada push a main o dev publica las imágenes en ghcr.io/<owner>/tpcs-<app>
# (multi-arquitectura: linux/amd64 + linux/arm64) con los tags: la rama
# (main | dev), el sha corto del commit y, en main, latest.
on:
  push:
    branches: [main, dev]
    # Solo lo que acaba dentro de alguna imagen: los cambios de web, accounts, docs, etc. no
    # recompilan nada. Para forzarlo, ejecútalo a mano (workflow_dispatch)
    paths:
      - "apps/api/**"
      - "apps/worker/**"
      - "apps/auth/**"
      - "apps/discordbot/**"
      - "apps/imagerenderer/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/publish-images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [api, worker, auth, discordbot, imagerenderer]
    steps:
      - uses: actions/checkout@v4

      # QEMU para compilar arm64 desde el runner amd64
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          # GHCR exige el nombre en minúsculas
          images: ghcr.io/${{ github.repository_owner }}/tpcs-${{ matrix.app }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

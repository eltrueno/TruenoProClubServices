name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/shared/**"
      - "packages/auth/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependencias
        # Solo la web y sus dependencias del workspace (shared, auth). No se
        # instala eafcapi: trae puppeteer y su postinstall descarga Chrome.
        run: pnpm install --frozen-lockfile --filter @trueno-proclub-services/web...

      - name: Build de packages
        run: pnpm --filter @trueno-proclub-services/shared build && pnpm --filter @trueno-proclub-services/auth build

      - name: Build de la web
        # Un repo de GitHub Pages sirve un único sitio: aquí se compila un club.
        # El segundo club se publica desde otro repo con su propio Pages.
        run: pnpm --filter @trueno-proclub-services/web build
        env:
          PUBLIC_CLUB: ${{ vars.PUBLIC_CLUB || 'city' }}
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL || 'https://city.casemuro.stream' }}
          # api y auth salen de config/club.ts salvo que se definan aquí
          PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}
          PUBLIC_AUTH_URL: ${{ vars.PUBLIC_AUTH_URL }}

      - name: Dominio personalizado (CNAME)
        # Pages lee el dominio del artefacto; el host sale de PUBLIC_SITE_URL para que cada club publique en el suyo
        run: |
          host="${SITE#https://}"
          echo "${host%%/*}" > apps/web/dist/CNAME
        env:
          SITE: ${{ vars.PUBLIC_SITE_URL || 'https://city.casemuro.stream' }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
